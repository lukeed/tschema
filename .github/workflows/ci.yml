name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v**'

env:
  BUN_VERSION: 1.4.3
  DENO_VERSION: 2.x

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run fmt:check

      - name: Type Check
        run: bun run types

      - name: Test
        run: bun test --coverage

  gzip:
    name: Module Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: gzip (bytes)
        run: |
          for file in mod.ts validate.ts; do
            bytes=$(bun build --minify $file | bunx terser --mangle --compress --module --ecma=2020 | gzip -9 | wc -c)
            echo "::notice::${file} ${bytes} b (gzip)"
          done

  dryrun:
    needs: [test]
    name: 'Publish (dry run)'
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build 1.2.3
      - run: deno publish --dry-run
        working-directory: ./jsr

  # https://jsr.io/docs/publishing-packages#publishing-from-github-actions
  # https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages#publishing-packages-to-the-npm-registry
  publish:
    needs: [test]
    name: Publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write # -> authentication
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Build
        run: |
          bun install --frozen-lockfile
          VERSION=${GITHUB_REF#refs/tags/v}
          bun run build $VERSION

      - name: 'Publish → jsr'
        if: ${{ !contains(github.ref, '-next.') }}
        run: deno publish
        working-directory: ./jsr

      - name: 'Publish → npm'
        if: ${{ !contains(github.ref, '-next.') }}
        run: npm publish --provenance --access public
        working-directory: ./npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 'Publish → npm (pre-release)'
        if: ${{ contains(github.ref, '-next.') }}
        run: npm publish --tag next --provenance --access public
        working-directory: ./npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
