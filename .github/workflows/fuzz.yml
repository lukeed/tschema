name: Fuzz

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: 'Number of cases'
        default: '5000'
      seed:
        description: 'First seed (default: a new range each day)'
        default: ''

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.3

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Fuzz
        env:
          RUNS: ${{ inputs.runs || '5000' }}
          SEED: ${{ inputs.seed }}
          TMPDIR: ${{ runner.temp }}
        run: |
          day=$(( $(date -u +%s) / 86400 ))
          bun run fuzz "$RUNS" "${SEED:-$(( day * 10000 ))}"

      - name: Upload repro
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-repro
          path: ${{ runner.temp }}/tschema-fuzz
